# Configuration JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true



# Autoriser les requetes depuis le frontend
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Configuration de la journalisation (Logging) de production
logging.file.name=C:/CDL/logs/ajustement.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.root=INFO
logging.level.com.cdl.ajustement=DEBUG

# Configuration LDAP
ldap.url=ldap://annuaire.attijaribank.tn
ldap.domain=bank-sud
ldap.domainComponent=tn
